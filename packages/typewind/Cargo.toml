[package]
name = "typewind-swc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "swc/lib.rs"

[profile.release]
lto = true

[dependencies]
serde = "1"
serde_json = "1.0"
swc_core = { version = "27.0.1", features = ["ecma_plugin_transform"] }
swc_ecma_codegen = "14.0.0"

# .cargo/config.toml defines few alias to build plugin.
# cargo build-wasi generates wasm32-wasip1 binary (WASI Preview 1)
# cargo build-wasm32 generates wasm32-unknown-unknown binary.
